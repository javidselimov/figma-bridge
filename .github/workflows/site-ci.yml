name: Site CI

on:
  pull_request:
    paths:
      - "figma-bridge-site/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "figma-bridge-site/**"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_API_URL: https://api.example.com # non-secret placeholder for env validation at build time

defaults:
  run:
    working-directory: figma-bridge-site

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: figma-bridge-site/.nvmrc
          cache: npm
          cache-dependency-path: figma-bridge-site/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: figma-bridge-site/.nvmrc
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: figma-bridge-site/.nvmrc
          cache: npm
          cache-dependency-path: figma-bridge-site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # webServer in playwright.config.ts builds and starts the production app
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            figma-bridge-site/playwright-report/
            figma-bridge-site/test-results/
          retention-days: 7
